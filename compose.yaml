services:
  app:
    build: .
    # Run as the host user so files created in the mounted project
    # (vendor/, .env, database.sqlite) are not owned by root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    environment:
      APP_PORT: "${APP_PORT:-8000}"
